name: Test

# Runs on every push and pull request: vet plus the race-detected test suite
# on the three desktop platforms. This is the merge gate; release.yml repeats
# the Linux run as a pre-publish check.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -timeout 10m ./...

      - name: Test with race detector
        run: go test -race -timeout 10m ./...
