name: Apply QNAME low-allocation hot path

on:
  push:
    branches:
      - perf/throughput-pipeline

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/throughput-pipeline
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Benchmark current query construction
        shell: bash
        run: |
          cat > qname_lowalloc_bench_test.go <<'EOF'
          package dnstunnel

          import "testing"

          func BenchmarkQNameHotPath(b *testing.B) {
          	payload := make([]byte, 128)
          	b.ReportAllocs()
          	b.SetBytes(int64(len(payload)))
          	b.ResetTimer()
          	for i := 0; i < b.N; i++ {
          		_ = qnameRandomCase(buildQueryName(dnsTunnelMarker, "matrix.bench.local", "0123456789abcdef", uint32(i), uint32(i), uint32(i), flagData, payload))
          	}
          }
          EOF
          gofmt -w qname_lowalloc_bench_test.go
          go test -run '^$' -bench '^BenchmarkQNameHotPath$' -benchmem -benchtime=2s -count=7 . | tee /tmp/qname-base.txt

      - name: Apply pooled Base32 and fused 0x20 encoding
        shell: bash
        run: |
          cat > qname_hotpath.go <<'EOF'
          package dnstunnel

          import (
          	"crypto/rand"
          	"sync"
          )

          // queryEncodingBufferPool holds the temporary Base32 run used while
          // inserting DNS label separators. Keeping this separate from the final
          // QNAME pool lets concurrent query builders reuse both independently.
          var queryEncodingBufferPool = sync.Pool{New: func() any {
          	buf := make([]byte, 0, 512)
          	return &buf
          }}

          // randomizeQNameCaseBytes applies DNS 0x20 encoding in-place. The hot
          // path calls this before the final []byte -> string conversion, avoiding
          // the old string -> []byte -> string round trip on every query.
          func randomizeQNameCaseBytes(b []byte) {
          	if len(b) == 0 {
          		return
          	}
          	var coins [32]byte // 256 bits; DNS names are at most 253 text bytes.
          	n := (len(b) + 7) / 8
          	if n > len(coins) {
          		n = len(coins)
          	}
          	if _, err := rand.Read(coins[:n]); err != nil {
          		return
          	}
          	bit := 0
          	for i := range b {
          		if b[i] < 'a' || b[i] > 'z' {
          			continue
          		}
          		if coins[bit>>3]&(1<<uint(bit&7)) != 0 {
          			b[i] ^= 0x20
          		}
          		bit++
          	}
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path('protocol.go')
          s = p.read_text()
          start = s.index('func buildQueryName(')
          end = s.index('\nfunc splitTxt(', start)
          replacement = r'''func buildQueryName(marker, domain, session string, seq, ack, dataSeq uint32, flag byte, data []byte) string {
          	return buildQueryNameWithCase(marker, domain, session, seq, ack, dataSeq, flag, data, false)
          }

          // buildQueryNameRandomized is the client hot path: it applies DNS 0x20
          // case randomization while the final QNAME is still mutable, so only one
          // []byte -> string conversion is required.
          func buildQueryNameRandomized(marker, domain, session string, seq, ack, dataSeq uint32, flag byte, data []byte) string {
          	return buildQueryNameWithCase(marker, domain, session, seq, ack, dataSeq, flag, data, true)
          }

          func buildQueryNameWithCase(marker, domain, session string, seq, ack, dataSeq uint32, flag byte, data []byte, randomCase bool) string {
          	domain = dns.Fqdn(domain)
          	pooled := queryNameBufferPool.Get().(*[]byte)
          	enc := dnsTunnelB32.EncodedLen(len(data))
          	labels := 0
          	if enc > 0 {
          		labels = (enc + dnsTunnelPayloadLabelChars - 1) / dnsTunnelPayloadLabelChars
          	}
          	required := len(domain) + len(session) + enc + labels + 64
          	buf := (*pooled)[:0]
          	if cap(buf) < required {
          		buf = make([]byte, 0, required)
          	}

          	buf = append(buf, session...)
          	buf = append(buf, '.')
          	buf = strconv.AppendUint(buf, uint64(seq), 10)
          	buf = append(buf, '.')
          	buf = strconv.AppendUint(buf, uint64(ack), 10)
          	buf = append(buf, '.')
          	buf = append(buf, flag, '.')
          	buf = strconv.AppendUint(buf, uint64(dataSeq), 10)
          	buf = append(buf, '.')

          	if enc > 0 {
          		encPooled := queryEncodingBufferPool.Get().(*[]byte)
          		encBuf := (*encPooled)[:0]
          		if cap(encBuf) < enc {
          			encBuf = make([]byte, enc)
          		} else {
          			encBuf = encBuf[:enc]
          		}
          		dnsTunnelB32.Encode(encBuf, data)
          		for i := 0; i < enc; i += dnsTunnelPayloadLabelChars {
          			end := i + dnsTunnelPayloadLabelChars
          			if end > enc {
          				end = enc
          			}
          			buf = append(buf, encBuf[i:end]...)
          			buf = append(buf, '.')
          		}
          		if cap(encBuf) <= 512 {
          			*encPooled = encBuf[:0]
          			queryEncodingBufferPool.Put(encPooled)
          		}
          	}

          	buf = append(buf, marker...)
          	buf = append(buf, '.')
          	buf = append(buf, domain...)
          	if randomCase {
          		randomizeQNameCaseBytes(buf)
          	}
          	name := string(buf)
          	if cap(buf) <= 512 {
          		*pooled = buf[:0]
          		queryNameBufferPool.Put(pooled)
          	}
          	return name
          }
          '''
          p.write_text(s[:start] + replacement + s[end:])

          p = Path('client.go')
          s = p.read_text()
          old = '''\tname := buildQueryName(t.marker, t.domain, t.session, seq, atomic.LoadUint32(&t.ack), dataSeq, flag, wirePayload)
          \t// 0x20-style QNAME case randomization: the parser folds case, resolvers and
          \t// firewalls see per-query entropy that real stub clients also produce.
          \tname = qnameRandomCase(name)
          '''
          new = '''\t// Build and 0x20-randomize in one mutable buffer so the hot path pays
          \t// for only one final []byte -> string conversion.
          \tname := buildQueryNameRandomized(t.marker, t.domain, t.session, seq, atomic.LoadUint32(&t.ack), dataSeq, flag, wirePayload)
          '''
          if s.count(old) != 1:
              raise SystemExit(f'expected buildQuery composition once, got {s.count(old)}')
          s = s.replace(old, new)

          start = s.index('func qnameRandomCase(')
          end = s.index('\nfunc (t *DNSClientTunnel) sendQuery(', start)
          wrapper = r'''func qnameRandomCase(name string) string {
          	b := []byte(name)
          	randomizeQNameCaseBytes(b)
          	return string(b)
          }
          '''
          p.write_text(s[:start] + wrapper + s[end:])
          PY

          cat > qname_lowalloc_bench_test.go <<'EOF'
          package dnstunnel

          import (
          	"bytes"
          	"testing"
          )

          func TestBuildQueryNameRandomizedRoundTrip(t *testing.T) {
          	payload := bytes.Repeat([]byte{0xa5}, 96)
          	for i := 0; i < 32; i++ {
          		name := buildQueryNameRandomized(dnsTunnelMarker, "example.com", "0123456789abcdef", 123, 45, 67, flagData, payload)
          		session, seq, ack, dataSeq, flag, got, err := parseQueryName("example.com", name)
          		if err != nil {
          			t.Fatalf("parse randomized query: %v", err)
          		}
          		if session != "0123456789abcdef" || seq != 123 || ack != 45 || dataSeq != 67 || flag != flagData || !bytes.Equal(got, payload) {
          			t.Fatalf("round trip mismatch: session=%q seq=%d ack=%d dataSeq=%d flag=%q payload=%d", session, seq, ack, dataSeq, flag, len(got))
          		}
          	}
          }

          func BenchmarkQNameHotPath(b *testing.B) {
          	payload := make([]byte, 128)
          	b.ReportAllocs()
          	b.SetBytes(int64(len(payload)))
          	b.ResetTimer()
          	for i := 0; i < b.N; i++ {
          		_ = buildQueryNameRandomized(dnsTunnelMarker, "matrix.bench.local", "0123456789abcdef", uint32(i), uint32(i), uint32(i), flagData, payload)
          	}
          }
          EOF

          gofmt -w client.go protocol.go qname_hotpath.go qname_lowalloc_bench_test.go

      - name: Focused query codec tests
        run: go test -count=20 -run 'TestBuildQueryNameRandomizedRoundTrip|TestMaxUpstreamPlainChunk|TestLongDataQName|TestOversizedRetransmit' -timeout 5m .

      - name: Vet
        run: go vet ./...

      - name: Full tests
        run: go test -count=1 -timeout 10m ./...

      - name: Race tests
        run: go test -count=1 -race -timeout 15m ./...

      - name: Benchmark optimized query construction
        shell: bash
        run: |
          go test -run '^$' -bench '^BenchmarkQNameHotPath$' -benchmem -benchtime=2s -count=7 . | tee /tmp/qname-head.txt
          go run golang.org/x/perf/cmd/benchstat@latest /tmp/qname-base.txt /tmp/qname-head.txt | tee /tmp/qname-benchstat.txt
          cat /tmp/qname-benchstat.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Throughput smoke
        run: >-
          go test -run '^$'
          -bench 'BenchmarkUp(UDP|TCP|DoH)Target(TCP|UDP)$'
          -benchmem -benchtime=1s -count=1 -timeout 20m .

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-qname-lowalloc.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: reduce DNS query hot-path allocations'
          git push origin HEAD:perf/throughput-pipeline
