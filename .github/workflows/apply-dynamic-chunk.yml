name: Apply dynamic upstream chunk

on:
  push:
    branches:
      - perf/throughput-pipeline

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/throughput-pipeline
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Wire dynamic QNAME budget into the tunnel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('client.go')
          s = p.read_text()
          old = '''// setChunkSize re-sizes upstream chunks to the multi-label capacity, provided
          // the session's worst-case query name still fits the DNS 255-octet name limit.
          func (t *DNSClientTunnel) setChunkSize() {
          \tworst := len(t.session) + 1 + // session.
          \t\t10 + 1 + // seq.
          \t\t10 + 1 + // ack.
          \t\t1 + 1 + // flag.
          \t\t10 + 1 + // dataSeq.
          \t\t123 + // two 61-char data labels plus their separating dot
          \t\t1 + len(dnsTunnelMarker) + 1 + // .tunnel2.
          \t\tlen(t.domain) // fqdn domain includes its trailing dot
          \tif worst > 253 {
          \t\tt.log.Warnf("Domain too long for multi-label queries; staying on single-label chunk size")
          \t\treturn
          \t}
          \tt.chunkSize = 2 * 61 * 5 / 8 // two labels of base32 carry 76 wire bytes
          \tif t.noiseSession != nil {
          \t\tt.chunkSize -= noiseTagSize
          \t}
          }
          '''
          new = '''// setChunkSize re-sizes upstream chunks to the largest multi-label payload
          // that still fits the session's worst-case DNS QNAME. Old servers that do
          // not answer the capability/target probe never call this method, preserving
          // the historical conservative 32-byte (22-byte with Noise) fallback.
          func (t *DNSClientTunnel) setChunkSize() {
          \tnoise := t.noiseSession != nil && t.noiseSession.SendCipher != nil
          \tchunk := maxUpstreamPlainChunk(t.domain, t.marker, t.session, noise)
          \tif chunk <= 0 {
          \t\tt.log.Warnf("Domain/marker too long for expanded multi-label queries; staying on conservative chunk size")
          \t\treturn
          \t}
          \tt.chunkSize = chunk
          }
          '''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one setChunkSize block, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          gofmt -w client.go upstream_chunk.go upstream_chunk_test.go

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -timeout 10m ./...

      - name: Race test
        run: go test -count=1 -race -timeout 15m ./...

      - name: Benchmark dynamic chunk hot path
        run: go test -run '^$' -bench 'BenchmarkBuildQueryNameDynamicChunk|BenchmarkUp(UDP|TCP|DoH)Target(TCP|UDP)$' -benchmem -benchtime=1s -count=1 -timeout 20m .

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-dynamic-chunk.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client.go upstream_chunk.go upstream_chunk_test.go .github/workflows/apply-dynamic-chunk.yml
          git commit -m 'perf: use full DNS name budget for upstream chunks'
          git push origin HEAD:perf/throughput-pipeline
