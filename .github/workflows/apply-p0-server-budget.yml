name: Apply P0 Server Budget Fix

on:
  push:
    branches:
      - perf/throughput-p0
    paths:
      - '.github/workflows/apply-p0-server-budget.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout perf branch
        uses: actions/checkout@v4
        with:
          ref: perf/throughput-p0
          fetch-depth: 0

      - name: Apply response-budget patch
        run: python3 scripts/apply_p0_server_budget.py

      - name: Format and validate diff
        run: |
          gofmt -w server.go protocol.go
          git diff --check

      - name: Test response-budget fix
        run: go test ./... -run 'TestServeDownstream|TestMaxUpstream|TestDynamicUpstream' -count=1

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.go protocol.go
          git commit -m 'fix: decouple downstream budget from long data qnames'
          git push origin HEAD:perf/throughput-p0
