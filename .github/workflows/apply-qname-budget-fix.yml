name: Apply QNAME budget fix

on:
  push:
    branches:
      - perf/throughput-pipeline

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/throughput-pipeline
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Apply dynamic upstream budget and current-query downstream sizing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Client: replace the historical fixed two-label chunk sizing.
          p = Path('client.go')
          s = p.read_text()
          marker = '// setChunkSize re-sizes upstream chunks to the multi-label capacity'
          start = s.index(marker)
          end = s.index('\n}\n', start) + 3
          replacement = '''// setChunkSize expands upstream DATA chunks to the largest multi-label payload
          // that fits the DNS QNAME safety budget. Old servers that do not answer the
          // capability/target probe never call this method, preserving the historical
          // conservative 32-byte (22-byte with Noise) fallback.
          func (t *DNSClientTunnel) setChunkSize() {
          \tnoise := t.noiseSession != nil && t.noiseSession.SendCipher != nil
          \tchunk := maxUpstreamPlainChunk(t.domain, t.marker, t.session, noise)
          \tif chunk <= 0 {
          \t\tt.log.Warnf("Domain/marker too long for expanded multi-label queries; staying on conservative chunk size")
          \t\treturn
          \t}
          \tt.chunkSize = chunk
          }
          '''
          p.write_text(s[:start] + replacement + s[end:])

          # Server: the longest DATA QNAME must not permanently poison the response
          # budget for later short poll queries.
          p = Path('server.go')
          s = p.read_text()
          old = 'downstreamData := sess.serveDownstream(q.Qtype, sess.noteQnameLen(len(q.Name)), udpBudget)'
          new = '''sess.noteQnameLen(len(q.Name))
          \tdownstreamData := sess.serveDownstream(q.Qtype, len(q.Name), udpBudget)'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one downstream caller, found {s.count(old)}')
          s = s.replace(old, new)

          old = '''\tif len(s.serverOut) > 0 {
          \t\t// Window full (or nothing fresh to send): refill the oldest gap. The frame
          \t\t// is rebuilt each time so retransmissions carry the current skipTo.
          \t\toldest := s.serverOutOrder[0]
          \t\treturn encodeDownstreamFrame(oldest, s.serverSkipTo, s.serverOut[oldest].ct)
          \t}
          '''
          new = '''\tif len(s.serverOut) > 0 {
          \t\t// Window full (or nothing fresh to send): refill the oldest gap. The frame
          \t\t// is rebuilt each time so retransmissions carry the current skipTo.
          \t\t// A chunk created for a short POLL query may not fit a later long DATA
          \t\t// query. Do not truncate or discard it: return an empty response here and
          \t\t// let one of the client's short poll queries retransmit it.
          \t\toldest := s.serverOutOrder[0]
          \t\tframe := encodeDownstreamFrame(oldest, s.serverSkipTo, s.serverOut[oldest].ct)
          \t\tif fitDownstreamPayloadBudget(qnameLen, len(frame), dns.TypeTXT, udpBudget) < len(frame) {
          \t\t\treturn nil
          \t\t}
          \t\treturn frame
          \t}
          '''
          if s.count(old) != 1:
              raise SystemExit(f'expected one retransmit block, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          gofmt -w client.go server.go upstream_chunk.go upstream_chunk_test.go downstream_qname_test.go

      - name: Focused regression tests
        run: |
          go test -count=10 -run '^(TestConcurrentNoiseTransfer|TestLongDataQNameDoesNotPoisonLaterPoll|TestOversizedRetransmitWaitsForShortPoll|TestMaxUpstreamPlainChunk.*)$' -timeout 5m .
          go test -count=5 -run '^TestRunUDPForwardClientLoop$' -timeout 3m ./cmd/dns_custom

      - name: Vet
        run: go vet ./...

      - name: Full tests
        run: go test -count=1 -timeout 10m ./...

      - name: Race tests
        run: go test -count=1 -race -timeout 15m ./...

      - name: Throughput smoke
        run: >-
          go test -run '^$'
          -bench 'BenchmarkBuildQueryNameDynamicChunk|BenchmarkUp(UDP|TCP|DoH)Target(TCP|UDP)$'
          -benchmem -benchtime=1s -count=1 -timeout 20m .

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-dynamic-chunk.yml
          rm -f .github/workflows/diagnose-qname-budget.yml
          rm -f .github/workflows/apply-qname-budget-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: decouple upstream QNAME and downstream response budgets'
          git push origin HEAD:perf/throughput-pipeline
